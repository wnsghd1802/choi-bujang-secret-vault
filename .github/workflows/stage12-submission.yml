name: Stage12 verified submission bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check deployed release matches this exact commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 10 \
              "https://choi-bujang-secret-vault-pied.vercel.app/aleph.json" -o /tmp/aleph12.json 2>/dev/null; then
              if node --input-type=module -e '
                import fs from "node:fs";
                const j=JSON.parse(fs.readFileSync("/tmp/aleph12.json","utf8"));
                process.exit(j.step===12 && j.commit===process.env.GITHUB_SHA
                  && j.repoUrl==="https://github.com/wnsghd1802/choi-bujang-secret-vault" ? 0 : 1);
              '; then
                echo "Verified production step 12 / matching commit."
                break
              fi
            fi
            if [[ "$attempt" == 45 ]]; then
              echo "::error::Production deployment did not match this commit; bundle not produced."
              exit 1
            fi
            sleep 10
          done
      - name: Regression tests
        run: |
          npm run test:12
          node --test test/step11.test.mjs
          npm run test:10
      - name: Prepare local-only explanation
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const explanation = [
              "12단계: 41종 점검 계획과 실제 API 및 로컬 모의 결과를 구별하는 작전실을 추가했습니다.",
              "12단계: 기존 판정기·탐지·접속 승인·복구 보호 기능을 유지하고 회귀 검사를 실행했습니다.",
              "12단계: 현재 프로덕션에 동일한 커밋·단계가 반영됐는지 확인한 후 제출 묶음을 작성합니다.",
              "실제 인증 사용자 A/B, 운영 회수 및 전체 41종의 실서버 결과는 이 자동화가 확인하지 않았습니다."
            ].join("\n");
            fs.writeFileSync("bundle-notes.json", JSON.stringify({ explanation, blockedAt: null }, null, 2) + "\n");
          '
      - name: Run actual bundle generator against deployed public endpoints
        run: npm run bundle
      - name: Upload submission JSON (never commit it)
        uses: actions/upload-artifact@v4
        with:
          name: stage12-submission
          path: artifacts/submission.json
          if-no-files-found: error
          retention-days: 30

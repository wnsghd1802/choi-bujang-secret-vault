name: Bonus persistence XDR verification
on:
  push:
    branches: [main]
    paths:
      - 'xdr/persistence/**'
      - 'xdr/fixtures/persistence.json'
      - 'test/persistence.test.mjs'
      - '.github/workflows/persistence-xdr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xdr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay with no package installation
        run: |
          test ! -d node_modules
          npm run xdr:run -- persistence
      - name: Check fixture categories, false positives, safe logs and isolation
        run: node --test test/persistence.test.mjs
      - name: Re-run exact command and compare committed result
        run: |
          npm run xdr:run -- persistence
          git diff --exit-code -- xdr/persistence/result.json

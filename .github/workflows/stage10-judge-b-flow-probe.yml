name: Stage10 independent B preseeded note flow
on:
  push:
    branches: [stage10-judge-b-flow-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/stage10-judge-b-flow-probe.test.mjs

name: Stage10 local recovery stop-point probe
on:
  push:
    branches: [stage10-restore-stop-points]
permissions:
  contents: read
jobs:
  stop-point-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/stage10-stop-points.test.mjs

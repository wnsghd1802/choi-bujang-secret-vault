name: Stage10 clean policy/audit scope hypothesis
on:
  push:
    branches: [stage10-policy-scope-clean-audit]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean dependency install (npm install)
        run: npm install
      - name: Test original policy restoration preserves other detector
        run: node --test test/stage10-policy-scope-contract.test.mjs
      - name: Verify signed stage10 notes/audit implementation independently
        if: always()
        run: npm run test:10
      - name: Earlier stages and decision/detection contract regression
        if: always()
        run: |
          npm run policy:check
          npm run decider:test
          npm run detect:test
          node --test test/step7.test.mjs test/step8.test.mjs test/step8-judge-isolation.test.mjs test/step9.test.mjs test/stage3.test.mjs test/stage4.test.mjs
      - name: Independent PostgreSQL 16 recovery and audit scope tests
        env:
          PGPASSWORD: synthetic-test-only
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f test/fixtures/stage10-clean-schema.sql
          psql -v ON_ERROR_STOP=1 -f migrations/010-test-recovery.sql
          psql -v ON_ERROR_STOP=1 -f migrations/010-verify-backup.sql
          psql -v ON_ERROR_STOP=1 -f migrations/011-immutable-stage10-history.sql
          psql -v ON_ERROR_STOP=1 -f migrations/012-stage10-evidence-permissions.sql
          psql -v ON_ERROR_STOP=1 -f migrations/013-stage10-audit-reverification.sql
          psql -v ON_ERROR_STOP=1 -f test/fixtures/stage10-clean-audit.sql

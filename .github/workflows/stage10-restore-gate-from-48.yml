name: Stage10 exact restore gate vs 48-point baseline
on:
  push:
    branches: [stage10-candidate-48-restore-gate]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify registered restore route and A/B protected handler
        run: node --test test/stage10-restore-gateway.test.mjs
      - name: Policy restore plan still read-only and guarded
        run: npm run policy:check
      - name: Ten-step and early-stage regression
        run: |
          npm run test:10
          npm run decider:test
          npm run detect:test
          node --test test/step7.test.mjs test/step8.test.mjs test/step8-judge-isolation.test.mjs test/step9.test.mjs test/stage3.test.mjs test/stage4.test.mjs

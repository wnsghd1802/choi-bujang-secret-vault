name: Stage12 isolated checkout diagnostic
on:
  push:
    branches: [main, stage12-manifest-no-index-lab-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-checkouts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        depth: [1, 0]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.depth }}
      - name: Use Node 22 (no package install)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show test environment
        run: |
          echo "checkout depth ${{ matrix.depth }}"
          git log -1 --format='%h %s'
          test ! -d node_modules && echo 'No node_modules present'
      - name: Run exact bundle with no package installation or local notes
        run: npm run bundle
      - name: Verify manifest equals actual full-history Git diff
        if: matrix.depth == 0
        shell: bash
        run: |
          git diff --name-only --no-renames fd087248b89674aadc256d677972301e8b92f5cf HEAD > "$RUNNER_TEMP/stage12-verified-names.txt"
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const j = JSON.parse(fs.readFileSync("artifacts/submission.json", "utf8"));
            const actual = fs.readFileSync(process.env.RUNNER_TEMP + "/stage12-verified-names.txt", "utf8").trim().split("\n").sort();
            assert.deepEqual(j.changedFiles, actual);
            console.log("Verified manifest against independent Git diff:", actual.length);
          '
      - name: Verify bundle with missing Git index
        shell: bash
        run: |
          test -f .git/index
          mv .git/index .git/index.disabled-for-stage12-test
          rm -f artifacts/submission.json
          npm run bundle
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const j = JSON.parse(fs.readFileSync("artifacts/submission.json", "utf8"));
            assert.equal(j.changedFiles.length, 22);
            assert.equal(j.attackAttempts.filter(x => x.observed === "not_run").length, 12);
            console.log("Bundle without index verified", j.step, j.attackAttempts.length);
          '
          mv .git/index.disabled-for-stage12-test .git/index

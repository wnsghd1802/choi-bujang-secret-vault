name: Stage10 isolated audit reproduction
on:
  push:
    branches: [stage10-audit-isolation-repro]
permissions:
  contents: read
jobs:
  audit-repro:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/stage10-audit-isolation-repro.test.mjs
      - name: Real isolated PostgreSQL 16 recovery/audit transaction
        env:
          PGPASSWORD: synthetic-isolated-only
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f test/fixtures/stage10-postgres-setup.sql
          # No hand-picked migration order: run files by the same filename
          # order as a fresh judge checkout would commonly use.
          mapfile -t migration_files < <(find migrations -maxdepth 1 -name '010-*.sql' | sort)
          printf 'migration: %s\n' "${migration_files[@]}"
          test "${migration_files[0]}" = 'migrations/010-test-recovery.sql'
          test "${migration_files[1]}" = 'migrations/010-verify-backup.sql'
          test "${#migration_files[@]}" -eq 2
          for file in "${migration_files[@]}"; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -v ON_ERROR_STOP=1 -f migrations/011-immutable-stage10-history.sql
          psql -v ON_ERROR_STOP=1 -f migrations/012-stage10-evidence-permissions.sql
          psql -v ON_ERROR_STOP=1 -f migrations/013-stage10-audit-reverification.sql
          psql -v ON_ERROR_STOP=1 -f test/fixtures/stage10-postgres-integrity.sql

name: Stage10 isolated audit reproduction
on:
  push:
    branches: [stage10-audit-isolation-repro]
permissions:
  contents: read
jobs:
  audit-repro:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/stage10-audit-isolation-repro.test.mjs
      - name: Real isolated PostgreSQL 16 recovery/audit transaction
        env:
          PGPASSWORD: synthetic-isolated-only
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f test/fixtures/stage10-postgres-setup.sql
          # Simulate naive filename-ordered fresh installation: the current
          # 010-backup-reverification.sql sorts before 010-test-recovery.sql.
          if psql -v ON_ERROR_STOP=1 -f migrations/010-backup-reverification.sql > /tmp/out-of-order.log 2>&1; then
            echo 'Out-of-order 010 migration unexpectedly completed'
            exit 1
          else
            echo 'CONFIRMED: filename-order initialization fails before creation of test backup/audit tables'
            grep -E '(ERROR|does not exist)' /tmp/out-of-order.log | head -n 5 || true
          fi
          psql -v ON_ERROR_STOP=1 -f migrations/010-test-recovery.sql
          psql -v ON_ERROR_STOP=1 -f migrations/010-backup-reverification.sql
          psql -v ON_ERROR_STOP=1 -f migrations/011-immutable-stage10-history.sql
          psql -v ON_ERROR_STOP=1 -f migrations/012-stage10-evidence-permissions.sql
          psql -v ON_ERROR_STOP=1 -f migrations/013-stage10-audit-reverification.sql
          psql -v ON_ERROR_STOP=1 -f test/fixtures/stage10-postgres-integrity.sql

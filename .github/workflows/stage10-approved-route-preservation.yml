name: Stage10 policy route and audit preservation test
on:
  push:
    branches: [stage10-policy-preserve-approved-route]
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: New route preservation and complete stage10 regression
        run: npm run test:10
      - name: Original policy checkpoint read-only check
        run: npm run policy:check
      - name: Previous-stage contract suite
        run: |
          npm run decider:test
          npm run detect:test
          node --test test/step7.test.mjs test/step8.test.mjs test/step8-judge-isolation.test.mjs test/step9.test.mjs test/stage3.test.mjs test/stage4.test.mjs

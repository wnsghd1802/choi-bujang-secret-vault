name: Stage 11 + prior regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bundle diff-tree must not mistake HEAD for the repository root
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify stage 9 policy checkpoint (read-only)
        run: npm run policy:check
      - run: npm run test:10
      - run: node --test test/step11.test.mjs
      - run: node scripts/build-public.mjs --local
      - run: npm run decider:test
      - run: npm run detect:test
      - name: Current stage 7/8/9 contract regression
        run: node --test test/step7.test.mjs test/step8.test.mjs test/step8-judge-isolation.test.mjs test/step9.test.mjs
      - name: Stage 3-5 signed access and isolation regression (mandatory)
        run: node --test test/stage3.test.mjs
      - name: Stage 4 full previous-stage security matrix (mandatory)
        run: node --test test/stage4.test.mjs
      - name: Prepare local-only stage 11 submission notes
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const notes = {
            explanation: '11단계에서 설치형 웹앱과 기기 승인 요청 및 결과 표시를 구현했습니다. 승인 상태는 서버 DB에서 확인하고 보호 API는 등록 기기의 요청별 전자서명을 검증합니다. 이전 10단계 복구와 로그 및 데이터는 유지하며 심판 결과는 별도로 확인해야 합니다.',
            blockedAt: '기기 승인 행은 관리자의 별도 검증으로 승인되어야 합니다. 자동 승인 기능은 없습니다. 심판과 실제 기기 등록의 연동 결과는 미확인입니다.'
          };
          writeFileSync('bundle-notes.json', JSON.stringify(notes, null, 2) + '\n');
          NODE
      - name: Produce stage 11 submission JSON
        run: npm run bundle
      - name: Upload private submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage11-submission
          path: artifacts/submission.json
          if-no-files-found: error
          retention-days: 7

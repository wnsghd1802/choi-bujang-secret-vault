<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 로그인 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: auto; padding: 36px 20px 60px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 44px); }
    h2 { font-size: 22px; }
    h3 { margin: 0 0 10px; overflow-wrap: anywhere; }
    p { line-height: 1.7; color: #bfd0e5; overflow-wrap: anywhere; }
    .panel, li { border: 1px solid #51667c; padding: 20px; border-radius: 14px; background: #1a2a3d; margin: 18px 0; }
    label { display: block; margin: 14px 0 6px; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #728399; border-radius: 8px; background: #101a28; color: inherit; font: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    button { padding: 11px 16px; margin-top: 14px; border: 1px solid #8ad8df; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #faf0ac; outline-offset: 3px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    ul { list-style: none; padding: 0; }
    #status { min-height: 1.5em; color: #faf0ac; }
    #account { color: #8ad8df; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버로 모으기</div>
    <h1>실습 자료실</h1>
    <p>로그인한 뒤 가상 메모를 작성할 수 있습니다. 실제 개인정보는 넣지 마세요.</p>
    <div class="actions"><span id="account">로그인되지 않음</span><button id="logout" hidden>로그아웃</button></div>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="login-panel" class="panel" aria-labelledby="login-heading">
      <h2 id="login-heading">로그인</h2>
      <form id="login-form">
        <label for="email">이메일</label><input id="email" type="email" autocomplete="username" required>
        <label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required>
        <button id="login" type="submit">로그인</button>
      </form>
    </section>
    <section id="workspace" hidden aria-label="내 메모">
      <form id="note-form" class="panel">
        <h2>메모 작성</h2>
        <label for="title">제목</label><input id="title" maxlength="120" required>
        <label for="body">내용</label><textarea id="body" maxlength="10000"></textarea>
        <div class="actions"><button id="save" type="submit">메모 추가</button><button id="cancel" type="button" hidden>수정 취소</button></div>
      </form>
      <h2>내 메모</h2><p id="empty" hidden>아직 작성한 메모가 없습니다. 첫 메모를 추가해 보세요.</p>
      <ul id="notes" aria-live="polite"></ul>
    </section>
    <noscript>로그인하려면 브라우저에서 JavaScript를 활성화해 주세요.</noscript>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
